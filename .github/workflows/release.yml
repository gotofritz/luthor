name: Release

# A version tag (v0.x.y) builds the Mac app and attaches it to a GitHub Release. On a PR
# that changes the release build, the same build runs without publishing, so a broken release shows up
# before the tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Makefile
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the newest stable Xcode
        # The runner image's default Xcode lags behind; build with what the Mac in use has.
        run: |
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Build
        run: make dist
      - name: Keep the zips
        uses: actions/upload-artifact@v4
        with:
          name: luthor-dist
          path: .build/dist/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

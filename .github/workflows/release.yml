name: Release

# A push to main that carries a release (a feat, a fix or a perf commit, or a breaking change since the
# last tag) works out the next version from the Conventional Commits, builds the Mac app and publishes it
# in a GitHub Release, which also creates the tag. Pushing a version tag by hand (v0.x.y) publishes that
# version instead. On a PR that changes the release build, the same build runs without publishing, so a
# broken release shows up before it matters.
#
# The build job can only read. A second job, which runs only when there is something to publish, holds the
# write permission: it checks the zip, adds a checksum file and a build provenance attestation, makes the
# release as a draft with every asset attached, and only then publishes it, so a failure half way leaves
# a draft, never a release without its assets.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - Makefile
      - .github/workflows/release.yml
      - scripts/next-version.sh
      - scripts/check-version-tag.sh

permissions: {}

# One release at a time, so two merges in a row cannot both pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build release
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the newest stable Xcode
        # The runner image's default Xcode lags behind; build with what the Mac in use has.
        run: |
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Work out the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) next="$GITHUB_REF_NAME" ;;
            refs/heads/main)
              latest="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
              next="$(git log --format=%s ${latest:+"$latest..HEAD"} | scripts/next-version.sh "$latest")"
              ;;
            *) next="" ;; # a PR: build, do not publish
          esac
          if [ -n "$next" ]; then scripts/check-version-tag.sh "$next"; fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: ${next:-none}"
      - name: Build
        if: github.event_name == 'pull_request' || steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make dist ${VERSION:+VERSION="$VERSION"}
      - name: Keep the zips
        if: github.event_name == 'pull_request' || steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: luthor-dist
          path: .build/dist/*.zip

  publish:
    name: Publish release
    needs: release
    if: github.event_name != 'pull_request' && needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luthor-dist
          path: dist
      - name: Check the zip and write its checksum
        working-directory: dist
        run: |
          zip="Luthor-$VERSION.zip"
          test -s "$zip"
          unzip -tq "$zip"
          unzip -l "$zip" | grep -q 'Luthor.app/Contents/MacOS/'
          sha256sum "$zip" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Luthor-*.zip
      - name: Make the release as a draft
        # A tag push already has its tag; for main the release creates it at this commit when published
        # (a tag made with the workflow token does not start another run).
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then target=(--verify-tag); else target=(--target "$GITHUB_SHA"); fi
          gh release create "$VERSION" dist/Luthor-*.zip dist/SHA256SUMS --draft --title "$VERSION" --generate-notes "${target[@]}"
      - name: Publish the release
        run: gh release edit "$VERSION" --draft=false

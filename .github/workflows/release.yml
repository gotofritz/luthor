name: Release

# A version tag (v0.x.y) builds the Mac app and the CLI and attaches both to a GitHub Release. On a PR
# that changes the release build, the same build runs without publishing, so a broken release shows up
# before the tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - Makefile
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: make dist
      - name: Keep the zips
        uses: actions/upload-artifact@v4
        with:
          name: luthor-dist
          path: .build/dist/*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

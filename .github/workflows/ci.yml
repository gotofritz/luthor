name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: make test-linux
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - name: Install make
        run: apt-get update && apt-get install -y make git
      - uses: actions/checkout@v4
      - name: Build and test the package
        run: make test-linux

  check:
    name: make check-ci
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        # The runner image's default Xcode lags behind; build with what the Mac in use has.
        run: |
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Install pinned tools
        run: make tools
      - name: Check
        run: make check-ci

# TEMPORARY: removed before the slice 14c PR is ready. Runs each `make check-ci` stage as its own step, so one
# failure does not hide the next, because the session writing slice 14c has no Swift toolchain.
name: scratch-14c

on:
  push:
    branches: [feature/slice-14c-qr8ha3]

permissions:
  contents: read

jobs:
  scratch:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -iv beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
      - name: Tools
        run: make tools
      - name: Format check
        if: always()
        run: |
          make format-check 2>&1 | head -n 200
      - name: SwiftLint
        if: always()
        run: |
          make swiftlint 2>&1 | head -n 200
      - name: Coverage
        if: always()
        run: |
          make coverage 2>&1 | grep -E "error|✘|failed|Test run|coverage|Coverage|%|below" | head -n 200
      - name: App
        if: always()
        run: |
          make app 2>&1 | grep -E "error|warning: unre|\*\* BUILD" | head -n 100
